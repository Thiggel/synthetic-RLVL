# BranchProof d5 in the midtraining document format (see utils.doc_to_text_deduction_bp_native),
# 2026-09-11. Generation stops at </answer>; 4,600 tokens leaves room for a
# depth-25 formal derivation (prompt max 3,392) inside the 8,192 window.
tag:
  - synthrlvl_deduction_bp_deep
task: synthrlvl_deduction_bp_native_d35
dataset_path: json
dataset_kwargs:
  data_files:
    test: /vol/tmp2/laitenbf/rlvl_data/datasets/deep_branchproof_20260911/branchproof_nl_d35.jsonl
test_split: test
output_type: generate_until
doc_to_text: !function utils.doc_to_text_deduction_bp_native
doc_to_target: "{{answer}}"
process_results: !function utils.process_deduction_bp_native
generation_kwargs:
  max_gen_toks: 14000
  until:
    - "</answer>"
  do_sample: false
  temperature: 0.0
repeats: 1
num_fewshot: 0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: answer_tag
    aggregation: mean
    higher_is_better: true
  - metric: formal_block
    aggregation: mean
    higher_is_better: true
  - metric: think_block
    aggregation: mean
    higher_is_better: true
  - metric: proof_block
    aggregation: mean
    higher_is_better: true
  - metric: response_words
    aggregation: mean
    higher_is_better: false
metadata:
  version: 1.0
