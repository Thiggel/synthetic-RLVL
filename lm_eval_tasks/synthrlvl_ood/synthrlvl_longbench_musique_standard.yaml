tag:
  - synthrlvl_ood
task: synthrlvl_longbench_musique_standard
dataset_path: Xnhyacinth/LongBench
dataset_name: musique
test_split: test
output_type: generate_until
doc_to_text: !function utils.doc_to_text_longbench_standard
doc_to_target: "{{answers}}"
process_results: !function utils.process_longbench_qa_standard
generation_kwargs:
  max_gen_toks: 32
  temperature: 1
  do_sample: false
  until: []
repeats: 1
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
  - metric: qa_f1_score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 2.0
